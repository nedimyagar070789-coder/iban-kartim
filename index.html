<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10233f">
<title>Banka Bilgilerim</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#edf4ff,#f8fafc 55%,#e8eef8);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172033}
.card{width:min(100%,420px);background:#fff;border:1px solid #e5eaf2;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(16,35,63,.12)}
.mark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#e8f0ff;color:#2459b5;font-size:25px;margin-bottom:20px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#58708f}
h1{font-size:27px;line-height:1.15;margin:8px 0 8px;color:#10233f}
.sub{margin:0 0 24px;color:#637086;font-size:14px;line-height:1.55}
.label{font-size:12px;font-weight:700;color:#6a7688;margin-bottom:8px}
.value{overflow-wrap:anywhere;background:#f6f8fb;border:1px solid #e6ebf2;border-radius:12px;padding:14px;font-size:15px;font-weight:650;letter-spacing:.02em}
.owner{margin:18px 0 22px;font-size:14px;color:#526078}
button{width:100%;border:0;border-radius:12px;background:#2459b5;color:white;font-size:15px;font-weight:750;padding:15px 18px;cursor:pointer}
button:focus-visible{outline:3px solid #9bbcff;outline-offset:3px}
.note{margin-top:16px;text-align:center;font-size:11px;line-height:1.5;color:#8a94a4}
#status{min-height:20px;margin-top:10px;text-align:center;color:#18764b;font-size:13px}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">↗</div>
  <div class="eyebrow">Banka bilgilerim</div>
  <h1>IBAN Bilgisi</h1>
  <p class="sub">Havale veya EFT yapmak için aşağıdaki hesap bilgilerini kullanabilirsiniz.</p>
  <div class="label">IBAN</div>
  <div class="value" id="iban">TR14 0006 4000 0013 4002 2312 99</div>
  <div class="owner"><strong>Hesap sahibi:</strong> MUSTU KUYUMCULUK</div>
  <button id="copyBtn" type="button">IBAN'ı Kopyala</button>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="note">Para göndermeden önce IBAN ve hesap sahibi bilgilerini kontrol edin.</div>
</main>
<script>
const copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', async () => {
  const iban = document.getElementById('iban').textContent.trim();
  if (iban.includes('BURAYA_YAZIN')) {
    document.getElementById('status').textContent = 'Önce örnek IBAN bilgisini kendi bilgilerinizle değiştirin.';
    return;
  }
  try {
    await navigator.clipboard.writeText(iban.replace(/\s+/g, ''));
    document.getElementById('status').textContent = 'IBAN kopyalandı.';
  } catch (e) {
    document.getElementById('status').textContent = 'IBAN metnini basılı tutarak kopyalayabilirsiniz.';
  }
});
</script>
</body>
</html>
